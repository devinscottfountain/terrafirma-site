<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>home3d.js Solutions test</title>
<!-- Mimics the Webflow Solutions DOM. Local test only. Serve from the repo root: python3 -m http.server
     three: /node_modules/three (npm i three@0.160.0 into a scratch dir and symlink it as ./node_modules, not committed),
     or add ?cdn to use jsDelivr. -->
<script>
  const cdn = new URLSearchParams(location.search).has('cdn');
  const map = cdn
    ? { three: 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js', 'three/addons/': 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/' }
    : { three: '/node_modules/three/build/three.module.js', 'three/addons/': '/node_modules/three/examples/jsm/' };
  document.head.appendChild(Object.assign(document.createElement('script'), { type: 'importmap', textContent: JSON.stringify({ imports: map }) }));
</script>
<style>
html,body{margin:0;background:#000;color:#fff;font:16px/1.4 system-ui,sans-serif}
.pre,.post{height:120vh;background:#000}
.sol{position:relative;overflow:hidden;padding:96px 0}
.stage{position:absolute;inset:0}
.container{position:relative;max-width:1280px;margin:0 auto;padding:0 40px;pointer-events:none}
.container h2{max-width:760px;margin:0 0 24px;font-size:40px;font-weight:500;line-height:1.15}
.spacer{min-height:640px}
.tabs{display:flex;gap:16px;pointer-events:auto}
.tabs button{flex:1;text-align:left;padding:24px;border:1px solid #333;background:#000;color:#b9b9b9;font:inherit;cursor:pointer}
.tabs button[aria-selected="true"]{background:#151515;color:#fff}
@media (max-width:991px){.spacer{min-height:0}.tabs{flex-direction:column}}
/* ?layout=stage: the planned layout, a 100svh stage with the heading on top and the tab list overlaid at the bottom */
html.lay-stage .sol{height:100svh;padding:0;box-sizing:border-box;--sol-safe-top:.3;--sol-safe-bottom:.28}
html.lay-stage .container{position:absolute;inset:0;max-width:none;display:flex;flex-direction:column;justify-content:space-between;padding:48px 40px 32px}
html.lay-stage .spacer{min-height:0;flex:1}
html.lay-stage .tabs button{background:rgba(0,0,0,.55);backdrop-filter:blur(6px)}
/* ?layout=tablet: a 713 x 560 stage with the heading above it and the tabs below (insets .06 / .1) */
html.lay-tablet .sol{padding:32px 0;--sol-safe-top:.06;--sol-safe-bottom:.1}
html.lay-tablet .stage{position:relative;width:713px;height:560px;margin:0 auto 24px}
html.lay-tablet .container{max-width:713px;padding:0}
html.lay-tablet .container h2{font-size:28px;position:absolute;top:-9999px}
html.lay-tablet .spacer{display:none}
/* small hosts: the heading takes half the stage, so the subject sits lower (per breakpoint safe insets) */
@media (max-height:520px){html.lay-stage .sol{--sol-safe-top:.5;--sol-safe-bottom:.3}}
@media (max-width:991px){html.lay-stage .container{padding:32px 20px 20px}html.lay-stage .container h2{font-size:28px}html.lay-stage .tabs{flex-direction:row;gap:8px}html.lay-stage .tabs button{padding:12px;font-size:12px}}
</style>
<script>{ const l = new URLSearchParams(location.search).get('layout'); if (l === 'stage' || l === 'tablet') document.documentElement.classList.add('lay-' + l); }</script></head><body>
<div class="pre"></div>
<section class="sol" id="solutions" data-three="solutions" data-sol-hint="Click to dig" data-sol-hint-drop="Click to drop" data-sol-tag-dig="Excavator 01" data-sol-tag-haul="Dozer 02" data-sol-tag-grade="Compactor 03">
  <div class="stage" id="solutions-stage" data-three-mount="solutions" aria-hidden="true"></div>
  <div class="container">
    <h2>Advancing construction with human-in-the-loop autonomy through Planning, Orchestration, and Operation</h2>
    <div class="spacer" data-solutions-spacer></div>
    <div class="tabs" data-tabs="solutions">
      <button data-tab="planning" aria-selected="false">PLANNING<br>Mission Planner</button>
      <button data-tab="orchestration" aria-selected="true">ORCHESTRATION<br>Mission Control</button>
      <button data-tab="execution" aria-selected="false">EXECUTION<br>Accelerated Operations</button>
    </div>
  </div>
</section>
<div class="post"></div>
<script>
  // stand-in for the Webflow page script: select a tab, dispatch tf:solutions (also once on load)
  const tabs = document.querySelectorAll('[data-tabs="solutions"] [data-tab]');
  const select = mode => {
    tabs.forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === mode)));
    window.dispatchEvent(new CustomEvent('tf:solutions', { detail: { mode } }));
  };
  tabs.forEach(b => b.addEventListener('click', () => select(b.dataset.tab)));
  select('orchestration');
</script>
<script type="module" src="../home3d.js"></script>
</body></html>
